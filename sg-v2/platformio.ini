; Smart Garden v2 - ESP32-C3 Super Mini / ESP-IDF
; platform 6.13.0 => ESP-IDF 5.5.3 (nhánh ổn định; 7.0.x/IDF 6.0 còn quá mới)

[env:esp32c3]
platform         = espressif32@6.13.0
board            = esp32-c3-devkitm-1
framework        = espidf
monitor_speed    = 115200
monitor_filters  = esp_idf_exception_decoder, time
upload_speed     = 921600
board_build.partitions = partitions.csv
board_build.flash_mode = dio
extra_scripts    = pre:tools/check_layers.py, pre:tools/versioning.py, pre:tools/build_web.py, post:tools/merge_bin.py

; Logic thuần chạy trên máy, không cần board.
; Đây là nơi bắt 3 lỗi của v1: scheduler bỏ lịch, leak flapping, echo loop.
; Bản để chạy trong QEMU. QEMU không mô phỏng ngoại vi ADC: đọc ADC thật sẽ
; quay vô hạn trong HAL chờ cờ chuyển đổi và làm nổ interrupt watchdog.
; NHT_ADC_FAKE thay giá trị đọc bằng biến đặt được từ code.
[env:esp32c3_sim]
extends          = env:esp32c3
build_flags      = -DNHT_ADC_FAKE=1 -DSG_SIM=1
extra_scripts    = pre:tools/check_layers.py, pre:tools/versioning.py, pre:tools/build_web.py, post:tools/merge_bin.py

; Bản chạy trong Wokwi. Wokwi CÓ mô phỏng WiFi (mạng mở "Wokwi-GUEST" ra được
; internet thật), nên đây là nơi duy nhất thử được toàn bộ đường Firebase:
; đăng nhập, REST, và stream SSE kèm chuyển hướng 307.
; ADC vẫn phải giả lập - Wokwi có ADC nhưng bản mô phỏng cần đặt giá trị chủ
; động từ code để self-test chạy được không cần người xoay biến trở.
[env:esp32c3_wokwi]
extends       = env:esp32c3
build_flags   = -DNHT_ADC_FAKE=1 -DSG_WOKWI=1
extra_scripts = pre:tools/check_layers.py, pre:tools/versioning.py, pre:tools/build_web.py, post:tools/merge_bin.py

; Board THẬT nhưng chưa đấu I/O: cảm biến ADC giả, có route /api/bench/* để
; đặt giá trị cảm biến, đọc mức relay, gây sự cố. KHÔNG phát hành bản này.
[env:esp32c3_bench]
extends       = env:esp32c3
build_flags   = -DNHT_ADC_FAKE=1 -DSG_BENCH=1
extra_scripts = pre:tools/check_layers.py, pre:tools/versioning.py, pre:tools/build_web.py, post:tools/merge_bin.py

[env:native]
platform       = native
test_framework = unity
test_build_src  = yes
build_flags =
    -std=gnu11
    -Wall -Wextra
    -DNHT_HOST_TEST=1
    -I components/nht_sched/include
    -I components/nht_dinput/include
    -I components/nht_actuator/include
    -I components/nht_valve/include
    -I components/nht_fbrtdb/include
build_src_filter =
    -<*>
    +<../components/nht_sched/nht_sched.c>
    +<../components/nht_dinput/nht_dinput.c>
    +<../components/nht_actuator/nht_actuator.c>
    +<../components/nht_valve/nht_valve.c>
    +<../components/nht_fbrtdb/nht_sse.c>
