; Smart Garden v2 - ESP32-C3 Super Mini / ESP-IDF
; platform 6.13.0 => ESP-IDF 5.5.3 (stable branch; 7.0.x / IDF 6.0 are still too new)

[env:esp32c3]
platform         = espressif32@6.13.0
board            = esp32-c3-devkitm-1
framework        = espidf
monitor_speed    = 115200
monitor_filters  = esp_idf_exception_decoder, time
upload_speed     = 921600
board_build.partitions = partitions.csv
board_build.flash_mode = dio
extra_scripts    = pre:tools/check_layers.py, pre:tools/versioning.py, pre:tools/build_web.py, post:tools/merge_bin.py

; Pure logic runs on the PC, no board needed.
; This is where the 3 bugs of v1 are caught: scheduler dropping runs, leak flapping, echo loop.
; Build that runs in QEMU. QEMU does not emulate the ADC peripheral: a real ADC read would
; spin forever in the HAL waiting for the conversion flag and trip the interrupt watchdog.
; NHT_ADC_FAKE replaces the reading with a value settable from code.
[env:esp32c3_sim]
extends          = env:esp32c3
build_flags      = -DNHT_ADC_FAKE=1 -DSG_SIM=1
extra_scripts    = pre:tools/check_layers.py, pre:tools/versioning.py, pre:tools/build_web.py, post:tools/merge_bin.py

; Build that runs in Wokwi. Wokwi DOES emulate WiFi (the open network "Wokwi-GUEST" reaches
; the real internet), so this is the only place the whole Firebase path can be tried:
; sign-in, REST, and the SSE stream with the 307 redirect.
; The ADC still has to be faked - Wokwi has an ADC, but the simulation must set values
; actively from code so the self-test runs without anyone turning a potentiometer.
[env:esp32c3_wokwi]
extends       = env:esp32c3
build_flags   = -DNHT_ADC_FAKE=1 -DSG_WOKWI=1
extra_scripts = pre:tools/check_layers.py, pre:tools/versioning.py, pre:tools/build_web.py, post:tools/merge_bin.py

; REAL board with nothing wired to it: fake ADC sensors, plus /api/bench/* routes to set
; sensor values, read relay levels and inject faults. NEVER ship this build.
[env:esp32c3_bench]
extends       = env:esp32c3
build_flags   = -DNHT_ADC_FAKE=1 -DSG_BENCH=1
extra_scripts = pre:tools/check_layers.py, pre:tools/versioning.py, pre:tools/build_web.py, post:tools/merge_bin.py

[env:native]
platform       = native
test_framework = unity
test_build_src  = yes
build_flags =
    -std=gnu11
    -Wall -Wextra
    -DNHT_HOST_TEST=1
    -I components/nhtlib/nht_sched/include
    -I components/nhtlib/nht_dinput/include
    -I components/nhtlib/nht_actuator/include
    -I components/nhtlib/nht_valve/include
    -I components/nhtlib/nht_fbrtdb/include
build_src_filter =
    -<*>
    +<../components/nhtlib/nht_sched/nht_sched.c>
    +<../components/nhtlib/nht_dinput/nht_dinput.c>
    +<../components/nhtlib/nht_actuator/nht_actuator.c>
    +<../components/nhtlib/nht_valve/nht_valve.c>
    +<../components/nhtlib/nht_fbrtdb/nht_sse.c>
