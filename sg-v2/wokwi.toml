[wokwi]
version = 1
# Merged flash image, padded to the full 4 MB, regenerated after every build.
firmware = ".pio/build/esp32c3_wokwi/merged.bin"
elf      = ".pio/build/esp32c3_wokwi/firmware.elf"

# Expose the device's port 80 as localhost:8180 to try the web UI.
[[net.forward]]
from = "localhost:8180"
to   = "target:80"
