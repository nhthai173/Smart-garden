version: "1.1.0"
description: >
  Firebase Realtime Database client for ESP-IDF: email/password sign-in
  with automatic token refresh, REST CRUD, and an SSE stream that handles
  the 307 redirect Firebase requires. Writes are queued, so the caller
  never blocks.
url: https://github.com/nhthai173/Smart-garden
license: MIT
targets: [esp32, esp32s2, esp32s3, esp32c3, esp32c6, esp32h2]
